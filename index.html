<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数ファイルZIPまとめツール</title>
    <!-- 安全な外部ライブラリ JSZip を読み込みます -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .file-input-area {
            margin-bottom: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            border: 1px dashed #ced4da;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #495057;
            display: block;
            margin-bottom: 5px;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ZIPまとめツール</h2>
    <p>あなたが作ったZIPファイルを選択し、ボタンを押すと自動生成されたテキストファイルと一緒に新しいZIPにまとめます。</p>
    
    <!-- 既存のZIPを選択するボタン -->
    <div class="file-input-area">
        <label for="userZipInput">組み込みたいZIPファイルを選択：</label>
        <input type="file" id="userZipInput" accept=".zip">
    </div>

    <button class="btn" id="createZipBtn">ZIPファイルを作成してダウンロード</button>
    <div id="status"></div>
</div>

<!-- 外部のJavaScriptファイルをここで読み込みます -->
<script src="script.js"></script>
</body>
</html>
