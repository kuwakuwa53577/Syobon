            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #218838;
        }

            color: #0056b3;

            URL.revokeObjectURL(url);
